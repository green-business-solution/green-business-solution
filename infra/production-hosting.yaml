AWSTemplateFormatVersion: "2010-09-09"
Description: Production hosting for Green Business Solution on retrofi.org.

Parameters:
  DomainName:
    Type: String
    Default: retrofi.org
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for the domain.
  EnableCustomDomain:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Attach retrofi.org aliases, create ACM validation, and manage Route 53 records.
  CertificateArn:
    Type: String
    Default: ""
    Description: Existing us-east-1 ACM certificate ARN to use for CloudFront. Leave empty to create one in this account.
  ManageRoute53Records:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Manage Route 53 alias records for the custom domain from this stack.
  ApiOriginDomainName:
    Type: String
    Description: API Gateway origin domain name without protocol, such as abc123.execute-api.us-east-1.amazonaws.com.

Conditions:
  ShouldConfigureCustomDomain: !Equals [!Ref EnableCustomDomain, "true"]
  HasCertificateArn: !Not [!Equals [!Ref CertificateArn, ""]]
  ShouldCreateCertificate: !And
    - !Condition ShouldConfigureCustomDomain
    - !Not [!Condition HasCertificateArn]
  ShouldManageRoute53Records: !And
    - !Condition ShouldConfigureCustomDomain
    - !Equals [!Ref ManageRoute53Records, "true"]
  ShouldUseCustomCertificate: !Or
    - !Condition ShouldConfigureCustomDomain
    - !Condition HasCertificateArn

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub gbs-retrofi-org-frontend-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: ShouldCreateCertificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub www.${DomainName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub www.${DomainName}
          HostedZoneId: !Ref HostedZoneId

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          !If
            - ShouldConfigureCustomDomain
            - - !Ref DomainName
              - !Sub www.${DomainName}
            - !Ref AWS::NoValue
        Comment: !Sub Green Business Solution hosting for ${DomainName}
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: frontend-s3
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            DomainName: !Ref ApiOriginDomainName
            Id: api-gateway
        CacheBehaviors:
          - AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            PathPattern: /api/*
            TargetOriginId: api-gateway
            ViewerProtocolPolicy: https-only
        PriceClass: PriceClass_100
        ViewerCertificate:
          !If
            - ShouldUseCustomCertificate
            - AcmCertificateArn: !If
                - HasCertificateArn
                - !Ref CertificateArn
                - !Ref Certificate
              MinimumProtocolVersion: TLSv1.2_2021
              SslSupportMethod: sni-only
            - CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  RootAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldManageRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub ${DomainName}.
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  RootIpv6AliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldManageRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub ${DomainName}.
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldManageRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub www.${DomainName}.
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwIpv6AliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldManageRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub www.${DomainName}.
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  ApiOriginDomainName:
    Value: !Ref ApiOriginDomainName
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
  FrontendBucketName:
    Value: !Ref FrontendBucket
  SiteUrl:
    Value: !If
      - ShouldConfigureCustomDomain
      - !Sub https://${DomainName}
      - !Join ["", ["https://", !GetAtt CloudFrontDistribution.DomainName]]
  WwwSiteUrl:
    Condition: ShouldConfigureCustomDomain
    Value: !Sub https://www.${DomainName}
