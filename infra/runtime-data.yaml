AWSTemplateFormatVersion: "2010-09-09"
Description: Runtime DynamoDB tables for Green Business Solution production.

Parameters:
  ManageCoreRuntimeTables:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create the core user, intake, and opportunity tables. Keep false in legacy accounts where those tables already exist outside this stack.
  UsersTable:
    Type: String
    Default: gbs-users
  IntakeTable:
    Type: String
    Default: gbs-client-intake
  OpportunitiesTable:
    Type: String
    Default: gbs-opportunity-candidates
  DashboardPerformanceTable:
    Type: String
    Default: gbs-dashboard-performance
  RetrofitRecommendationCacheTable:
    Type: String
    Default: gbs-retrofit-recommendation-cache
  ApplicationProfilesTable:
    Type: String
    Default: gbs-application-profiles
  ApiRuntimeStateTable:
    Type: String
    Default: gbs-api-runtime-state
  FirstmateTasksTable:
    Type: String
    Default: gbs-firstmate-tasks
  FirstmateTasksIngestionRoleName:
    Type: String
    Default: gbs-firstmate-task-ingestion
  FirstmateTasksIngestionPrincipalArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::[0-9]{12}:(role|user)/[A-Za-z0-9+=,.@_/-]+$"
    Description: Optional exact IAM role or user ARN allowed to assume the Firstmate task ingestion role. Leave blank to skip creating the ingestion role.

Conditions:
  ShouldManageCoreRuntimeTables: !Equals [!Ref ManageCoreRuntimeTables, "true"]
  ShouldCreateFirstmateTasksIngestionRole: !Not [!Equals [!Ref FirstmateTasksIngestionPrincipalArn, ""]]

Resources:
  UsersDynamoTable:
    Type: AWS::DynamoDB::Table
    Condition: ShouldManageCoreRuntimeTables
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref UsersTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  IntakeDynamoTable:
    Type: AWS::DynamoDB::Table
    Condition: ShouldManageCoreRuntimeTables
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref IntakeTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  OpportunitiesDynamoTable:
    Type: AWS::DynamoDB::Table
    Condition: ShouldManageCoreRuntimeTables
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref OpportunitiesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: opportunityId
          AttributeType: S
      KeySchema:
        - AttributeName: opportunityId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DashboardPerformanceDynamoTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DashboardPerformanceTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stateScope
          AttributeType: S
        - AttributeName: stateKey
          AttributeType: S
      KeySchema:
        - AttributeName: stateScope
          KeyType: HASH
        - AttributeName: stateKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RetrofitRecommendationCacheDynamoTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref RetrofitRecommendationCacheTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stateScope
          AttributeType: S
        - AttributeName: stateKey
          AttributeType: S
      KeySchema:
        - AttributeName: stateScope
          KeyType: HASH
        - AttributeName: stateKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ApplicationProfilesDynamoTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref ApplicationProfilesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stateScope
          AttributeType: S
        - AttributeName: stateKey
          AttributeType: S
      KeySchema:
        - AttributeName: stateScope
          KeyType: HASH
        - AttributeName: stateKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ApiRuntimeStateDynamoTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref ApiRuntimeStateTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stateScope
          AttributeType: S
        - AttributeName: stateKey
          AttributeType: S
      KeySchema:
        - AttributeName: stateScope
          KeyType: HASH
        - AttributeName: stateKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FirstmateTasksDynamoTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref FirstmateTasksTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stateScope
          AttributeType: S
        - AttributeName: stateKey
          AttributeType: S
      KeySchema:
        - AttributeName: stateScope
          KeyType: HASH
        - AttributeName: stateKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FirstmateTasksIngestionRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateFirstmateTasksIngestionRole
    Properties:
      RoleName: !Ref FirstmateTasksIngestionRoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref FirstmateTasksIngestionPrincipalArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FirstmateTaskSnapshotWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:PutItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FirstmateTasksTable}

Outputs:
  UsersTableName:
    Condition: ShouldManageCoreRuntimeTables
    Value: !Ref UsersTable
  IntakeTableName:
    Condition: ShouldManageCoreRuntimeTables
    Value: !Ref IntakeTable
  OpportunitiesTableName:
    Condition: ShouldManageCoreRuntimeTables
    Value: !Ref OpportunitiesTable
  DashboardPerformanceTableName:
    Value: !Ref DashboardPerformanceTable
  RetrofitRecommendationCacheTableName:
    Value: !Ref RetrofitRecommendationCacheTable
  ApplicationProfilesTableName:
    Value: !Ref ApplicationProfilesTable
  ApiRuntimeStateTableName:
    Value: !Ref ApiRuntimeStateTable
  FirstmateTasksTableName:
    Value: !Ref FirstmateTasksTable
  FirstmateTasksIngestionRoleArn:
    Condition: ShouldCreateFirstmateTasksIngestionRole
    Value: !GetAtt FirstmateTasksIngestionRole.Arn
