services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - gbs-dynamodb-local:/home/dynamodblocal/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-access-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gbs-minio-local:/data

volumes:
  gbs-dynamodb-local:
  gbs-minio-local:
